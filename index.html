<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Winspiring Minds | People. Leadership. Growth.</title>

    <meta
      name="description"
      content="Winspiring Minds helps organizations build strong people, strong leaders and strong businesses through people development, leadership and organizational growth."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://winspiringminds.com/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://winspiringminds.com/"
    />

    <meta
      property="og:title"
      content="Winspiring Minds | People. Leadership. Growth."
    />

    <meta
      property="og:description"
      content="Building strong people, strong leaders and strong businesses."
    />

    <meta
      property="og:site_name"
      content="Winspiring Minds"
    />

    <!-- Twitter / X sharing -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Winspiring Minds | People. Leadership. Growth."
    />

    <meta
      name="twitter:description"
      content="Building strong people, strong leaders and strong businesses."
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#071F52"
    />

    <!-- WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Winspiring Minds",
        "alternateName": "WinspiringMinds",
        "url": "https://winspiringminds.com/"
      }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Winspiring Minds",
        "url": "https://winspiringminds.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
